services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: campus-collective-backend
    ports:
      - "8000:8080"
    environment:
      - PORT=8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - ./data:/app/data
      - ./knowledge.json:/app/knowledge.json
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    container_name: campus-collective-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - backend
    restart: unless-stopped
